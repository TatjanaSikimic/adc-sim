[project]
name = "adc-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TatjanaSikimic", email = "tatjanasikimic16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.4",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

# how ruff needs to work
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["verifies(id): links a test to a test specification ID"]

[tool.coverage.run]
branch = true
source = ["adc_sim"]
